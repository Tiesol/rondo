{# Un campo de formulario con su etiqueta, su ayuda y sus errores. Parámetro: campo. #}
<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="peq tenue" id="{{ campo.auto_id }}_helptext">{{ campo.help_text }}</span>{% endif %}
  {% for error in campo.errors %}<span class="error-campo" role="alert">{{ error }}</span>{% endfor %}
</div>
