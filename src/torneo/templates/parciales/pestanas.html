{% comment %}
Pestañas subrayadas; cada una es un enlace, así la URL refleja dónde se está.
Parámetros: etiqueta (para lectores de pantalla) y pestanas: diccionarios con url, texto y actual.
{% endcomment %}
<nav class="pestanas" aria-label="{{ etiqueta }}">
  {% for p in pestanas %}
  <a href="{{ p.url }}"{% if p.actual %} aria-current="page"{% endif %}>{{ p.texto }}</a>
  {% endfor %}
</nav>
