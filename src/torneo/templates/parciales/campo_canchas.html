{# Casillas de canchas, en línea. Parámetro: campo (un ModelMultipleChoiceField con casillas). #}
<div class="campo">
  <span class="etiqueta">{{ campo.label }}</span>
  <div class="flex flex-wrap gap-2">
    {% for opcion in campo %}<label class="opcion">{{ opcion.tag }} {{ opcion.choice_label }}</label>{% endfor %}
  </div>
  {% if campo.help_text %}<span class="peq tenue">{{ campo.help_text }}</span>{% endif %}
</div>
